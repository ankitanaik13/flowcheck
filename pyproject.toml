[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelinemedic"
version = "1.0.0"
description = "Evidence-driven pipeline diagnosis and sandbox repair benchmark"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "duckdb>=1.2,<2", "pandas>=2.2,<4", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "httpx>=0.28,<1", "langgraph>=1,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "reportlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipelinemedic = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
