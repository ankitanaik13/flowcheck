services:
  workbench:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
